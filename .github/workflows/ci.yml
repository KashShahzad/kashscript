# ──────────────────────────────────────────────────────────────────────
# @kashscript — CI validation gates (the open protocol's public repository)
#
# Every push and pull request runs every open package's own test suite,
# the workspace typecheck, the licensing/publishing boundary, the public-
# tree check (nothing closed is ever added here: scripts/check-public-
# tree.ts), the publish-script tests, a secret scan and a static scan.
# Every third-party action is pinned to a commit SHA (the tag is in the
# comment); Dependabot (.github/dependabot.yml) proposes the bumps.
# Publishing to npm is a separate workflow: publish.yml (trusted
# publishing with provenance, docs/publishing.md).
# ──────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Mondays 03:17 UTC: the full-history secret scan again. Pushes scan only
    # the commits they carry; this and "Run workflow" scan everything.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package suites (the twelve open packages)
    # A10-03 (AUDIT-2026-11-11): attest, identity-core, predicate, wallet and the
    # other open packages are the kernel every engine pins exactly, and until AU-3
    # none of their suites — the countersign verifier, the SD-JWT verifier, the
    # conformance vectors — ran anywhere but a developer's machine. This runs each
    # package's own `test` script, sequentially, in the publish order of
    # scripts/trusted-publishing.json. attest's suite drives the CLI through node
    # and the verifier through headless Chromium; both are on ubuntu-latest.
    # publish.yml's gates run the same script before any publish.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Every open package's tests
        run: bun scripts/test-packages.ts

  validate:
    name: Typecheck + boundary gates
    # The weekly run exists for the secret scan; the gates already ran on the push.
    if: github.event_name != 'schedule'
    # The build's gates wait for every suite (A10-03).
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspace
        run: bun run --filter '*' typecheck

      - name: Verify licensing/publishing boundary
        run: bun run scripts/check-boundary.ts
        # Fails the build if any @kashscript/* package's publishConfig
        # contradicts its tier in docs/legal/license-matrix.md.

      - name: Verify the tree holds nothing closed
        run: bun run scripts/check-public-tree.ts .
        # AU-11: no closed or private path, every relative link resolves, and
        # scripts/trusted-publishing.json lists exactly the open packages.

      - name: Publish-script tests
        run: bun test scripts/publish-checks.test.ts scripts/sbom.test.ts scripts/confirm-landing.test.ts scripts/check-public-tree.test.ts
        # The token refusal, the OIDC and provenance checks, the SBOM generator and the
        # landing check that publish.yml relies on (RW-2).

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # push: the commits in the push · pull_request: the PR's commits ·
      # workflow_dispatch and schedule: the whole history. The action runs
      # gitleaks with --redact, so a finding is located but never printed.
      # Rules and the narrow allowlists are in .gitleaks.toml. A finding is
      # real until proven otherwise: rotate it, then fix history or record
      # the decision in that file.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  sast:
    name: Static scan (Semgrep community rules)
    # Semgrep's community rules; CodeQL can be added now that the repository is public.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --no-cache-dir semgrep==1.182.1

      # ERROR-severity findings fail the build; lesser ones are listed in the
      # log. No login, no telemetry. Paths excluded: .semgrepignore.
      - name: Scan
        run: >
          semgrep scan
          --config p/default
          --config p/typescript
          --severity ERROR
          --error
          --metrics off
          --disable-version-check
