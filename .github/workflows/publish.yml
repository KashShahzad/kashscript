# ──────────────────────────────────────────────────────────────────────
# @kashscript — publish to npm with trusted publishing (OIDC), provenance,
# an SBOM per package and a Sigstore-signed release
#
# P6 (ECOSYSTEM d84(f)): publishing never uses a long-lived token. npm
# exchanges this job's GitHub OIDC identity for a short-lived publish
# credential, and only for the repository + workflow + environment that the
# package's trusted publisher names on npmjs.com.
#
# RW-2 (2026-11-09; docs/publishing.md):
#   - every one of the twelve open packages is listed in
#     scripts/trusted-publishing.json, so the token path refuses them all;
#   - any npm credential in the environment or an .npmrc refuses the run,
#     dry runs included;
#   - a real publish passes --provenance, and refuses while the repository is
#     private (npm generates provenance only from a public one — fail closed);
#   - each package gets a CycloneDX 1.6 SBOM (scripts/sbom.ts); after a real
#     publish the release job signs every tarball, SBOM and SHA256SUMS with
#     Sigstore (cosign, keyless) and attaches them to a GitHub release;
#   - a dry run may run from any branch: it builds, packs, writes the SBOMs and
#     makes npm's OIDC exchange for each package, and fails with the stated
#     reason when npmjs.com is not configured or the repository is private.
#
# AU-3 (A10-03, AUDIT-2026-11-11): the gates run every open package's own test
# suite (scripts/test-packages.ts), and publish-to-npmjs.ts runs each package's
# `test` again before it builds — nothing publishes from a commit whose suites
# are not green.
#
# Same publish path as ever (ADR-0014): scripts/publish-to-npmjs.ts, versions
# bumped by hand first, clobbering refused. It runs here with --trusted.
#
# Manual trigger only: Actions → Publish → Run workflow. Real publishes only
# from master. The `npm-publish` environment holds every run until the founder
# approves it; a dry run from a branch needs that branch allowed on the
# environment (docs/publishing.md §3).
# ──────────────────────────────────────────────────────────────────────

name: Publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Directory slugs under packages/, space-separated, in publish order (e.g. identity-core attest). hudhud and neuron left this repository for Oreoasis's workspace on 2026-11-02 (KS-P1) and are published nowhere; the script still refuses the names."
        required: true
        type: string
      dry_run:
        description: "Dry run: build, pack, SBOM and check npmjs.com's trusted publisher; publish nothing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  gates:
    name: Typecheck + boundary gates
    # A real publish only from master; a dry run from any branch.
    if: github.ref == 'refs/heads/master' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspace
        run: bun run --filter '*' typecheck

      - name: Verify licensing/publishing boundary
        run: bun run scripts/check-boundary.ts

      - name: Publish-script tests
        run: bun test scripts/publish-checks.test.ts scripts/sbom.test.ts scripts/confirm-landing.test.ts

      - name: Every open package's tests
        run: bun scripts/test-packages.ts
        # A10-03: the twelve open packages' own suites, sequentially — the same
        # gate ci.yml runs on every push. The publish job cannot start without it.

  publish:
    name: Publish (trusted publishing)
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewer: the founder. The trusted publisher on npmjs.com names this
    # environment, so dry runs use it too — their OIDC claims must match.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a short-lived publish credential, and signs provenance with
    steps:
      # Before anything else: no npm credential anywhere in reach (the script checks again).
      - name: Refuse npm tokens
        run: |
          found=""
          for v in NODE_AUTH_TOKEN NPM_TOKEN; do
            if [ -n "$(printenv "$v" || true)" ]; then found="$found $v"; fi
          done
          while IFS= read -r v; do
            found="$found $v"
          done < <(compgen -e | grep -Ei '^npm_config_(//.*:)?_(authtoken|auth|password)$|:_(authtoken|auth|password)$' || true)
          for f in "$HOME/.npmrc" "${NPM_CONFIG_USERCONFIG:-}"; do
            if [ -n "$f" ] && [ -f "$f" ] && grep -Eiq '^[[:space:]]*([^#;[:space:]=][^=]*:)?_(authtoken|auth|password)[[:space:]]*=' "$f"; then
              found="$found $f"
            fi
          done
          if [ -n "$found" ]; then
            echo "::error::An npm credential is in reach:$found. Trusted publishing never uses a long-lived token (P6, RW-2)."
            exit 1
          fi
          echo "No npm credential in the environment or ~/.npmrc."

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.5

      # No registry-url: setup-node would write an .npmrc that expects NODE_AUTH_TOKEN.
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install npm 11.6.2
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Inputs reach the shell only through env, and only as slugs.
          if ! printf '%s' "$PACKAGES" | grep -Eq '^[a-z0-9][a-z0-9-]*( [a-z0-9][a-z0-9-]*)*$'; then
            echo "packages must be space-separated directory slugs (lowercase letters, digits, hyphens)" >&2
            exit 1
          fi
          flags="--trusted"
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi
          # shellcheck disable=SC2086 # word-splitting the validated slug list is the point
          bun scripts/publish-to-npmjs.ts $flags $PACKAGES

      # Tarballs, SBOMs and published.json — kept for dry runs too, and for a failed run's diagnosis.
      - name: Upload release files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.run_id }}
          path: release/
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Signed GitHub release (Sigstore)
    needs: publish
    # Only after a real publish, which itself refused unless the repository is public — so the
    # keyless signature's public transparency-log entry never names a private repository.
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and its tag
      id-token: write # cosign's keyless certificate from Sigstore's Fulcio
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.run_id }}
          path: release

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Checksums and signatures
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -- *.tgz *.cdx.json > SHA256SUMS
          for f in *.tgz *.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Create the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: npm-publish-${{ github.run_number }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/master
        run: |
          set -euo pipefail
          {
            echo "Published to npm by the Publish workflow, run ${GITHUB_RUN_ID}, from ${GITHUB_SHA}."
            echo
            jq -r '.packages[] | "- `\(.name)@\(.version)` (\(.tag // "latest")) — provenance on npm: \(if .provenance then "yes" else "NO" end)"' published.json
            echo
            echo "Each tarball and its CycloneDX SBOM is signed with Sigstore (keyless, this workflow's identity), as is SHA256SUMS. Verify:"
            echo
            echo '```'
            echo "npm view <package>@<version> --json | jq .dist.attestations"
            echo "sha256sum -c SHA256SUMS"
            echo "cosign verify-blob --bundle <file>.sigstore.json \\"
            echo "  --certificate-identity ${WORKFLOW_IDENTITY} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>"
            echo '```'
            echo
            echo "See docs/publishing.md."
          } > notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "npm publish ${GITHUB_RUN_NUMBER}: $(jq -r '[.packages[] | "\(.name)@\(.version)"] | join(", ")' published.json)" \
            --notes-file notes.md \
            -- *.tgz *.cdx.json SHA256SUMS *.sigstore.json published.json
